<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B2430" />
<title>Aile Hattı</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ======= GİRİŞ EKRANI ======= -->
  <div id="authScreen" class="screen active">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">AH</div>
        <h1>Aile Hattı</h1>
        <p class="tagline">Ailenle her zaman bir tık uzakta.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Giriş yap</button>
        <button class="auth-tab" data-tab="register">Kayıt ol</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <label>E-posta
          <input type="email" id="loginEmail" required autocomplete="email" />
        </label>
        <label>Şifre
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary">Giriş yap</button>
        <p class="auth-error" id="loginError"></p>
      </form>

      <form id="registerForm" class="auth-form">
        <label>Adın
          <input type="text" id="registerName" required autocomplete="name" />
        </label>
        <label>E-posta
          <input type="email" id="registerEmail" required autocomplete="email" />
        </label>
        <label>Şifre
          <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn btn-primary">Aileye katıl</button>
        <p class="auth-error" id="registerError"></p>
      </form>
    </div>
  </div>

  <!-- ======= ANA UYGULAMA ======= -->
  <div id="appScreen" class="screen">
    <div class="app-shell">

      <!-- Üst bar -->
      <header class="topbar">
        <div class="topbar-title">
          <span class="brand-mark small">AH</span>
          <span id="topbarLabel">Aile Sohbeti</span>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Çıkış yap" aria-label="Çıkış yap">⏻</button>
      </header>

      <!-- İçerik alanı: sohbet ya da üyeler/arama -->
      <main class="content">

        <!-- SOHBET VIEW -->
        <section id="chatView" class="view active">
          <div id="messages" class="messages"></div>
          <form id="messageForm" class="message-bar">
            <input type="text" id="messageInput" placeholder="Bir mesaj yaz…" autocomplete="off" />
            <button type="submit" class="btn btn-send" aria-label="Gönder">➤</button>
          </form>
        </section>

        <!-- ÜYELER / ARAMA VIEW -->
        <section id="callView" class="view">
          <div class="family-room-card">
            <div class="family-room-info">
              <h2>Aile Odası</h2>
              <p id="roomStatus">Kimse odada değil</p>
            </div>
            <button id="joinRoomBtn" class="btn btn-primary">Odaya katıl</button>
          </div>

          <h3 class="section-label">Üyeler</h3>
          <ul id="memberList" class="member-list"></ul>
        </section>

      </main>

      <!-- Alt sekme çubuğu -->
      <nav class="tabbar">
        <button class="tab-btn active" data-view="chatView">
          <span class="tab-icon">💬</span><span>Sohbet</span>
        </button>
        <button class="tab-btn" data-view="callView">
          <span class="tab-icon">📞</span><span>Arama</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- ======= GELEN ARAMA BİLDİRİMİ ======= -->
  <div id="incomingCall" class="overlay hidden">
    <div class="incoming-card">
      <div class="pulse-avatar" id="callerAvatar">?</div>
      <p id="callerName">Biri arıyor…</p>
      <div class="incoming-actions">
        <button id="rejectCallBtn" class="btn btn-round btn-reject" aria-label="Reddet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
        <button id="acceptCallBtn" class="btn btn-round btn-accept" aria-label="Kabul et">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ======= AKTİF ARAMA EKRANI ======= -->
  <div id="activeCall" class="overlay hidden">
    <div class="active-call-card">
      <p class="active-call-label" id="activeCallLabel">Aile Odası</p>
      <p class="call-status" id="callStatus">Çalıyor…</p>
      <div id="participantGrid" class="participant-grid"></div>
      <div class="call-controls">
        <button id="muteBtn" class="btn btn-round btn-muted" aria-label="Sessize al">
          <span class="icon-mic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>
          <span class="icon-mic-off" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><path d="M17 16.95A7 7 0 0 1 5 12v-2"/><path d="M19 10v2c0 .43-.05.85-.13 1.25"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>
        </button>
        <button id="hangupBtn" class="btn btn-round btn-hangup" aria-label="Kapat">
          <svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a.998.998 0 0 1-.56.9c-.98.49-1.87 1.12-2.66 1.85a.99.99 0 0 1-1.41-.01L.35 13.15a1 1 0 0 1 .01-1.41C3.42 8.86 7.51 7 12 7s8.58 1.86 11.64 4.74a1 1 0 0 1 .01 1.41l-2.42 2.41a.99.99 0 0 1-1.41.01c-.79-.73-1.68-1.36-2.66-1.85a.998.998 0 0 1-.56-.9v-3.1A16.68 16.68 0 0 0 12 9z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Firebase SDK (compat, CDN üzerinden) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/viewport-fix.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/call.js"></script>
</body>
</html>
