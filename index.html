<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B2430" />
<title>Aile Hattı</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ======= GİRİŞ EKRANI ======= -->
  <div id="authScreen" class="screen active">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">AH</div>
        <h1>Aile Hattı</h1>
        <p class="tagline">Ailenle her zaman bir tık uzakta.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Giriş yap</button>
        <button class="auth-tab" data-tab="register">Kayıt ol</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <label>E-posta
          <input type="email" id="loginEmail" required autocomplete="email" />
        </label>
        <label>Şifre
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary">Giriş yap</button>
        <p class="auth-error" id="loginError"></p>
      </form>

      <form id="registerForm" class="auth-form">
        <label>Adın
          <input type="text" id="registerName" required autocomplete="name" />
        </label>
        <label>E-posta
          <input type="email" id="registerEmail" required autocomplete="email" />
        </label>
        <label>Şifre
          <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn btn-primary">Aileye katıl</button>
        <p class="auth-error" id="registerError"></p>
      </form>
    </div>
  </div>

  <!-- ======= ANA UYGULAMA ======= -->
  <div id="appScreen" class="screen">
    <div class="app-shell">

      <!-- Üst bar -->
      <header class="topbar">
        <div class="topbar-title">
          <span class="brand-mark small">AH</span>
          <span id="topbarLabel">Aile Sohbeti</span>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Çıkış yap" aria-label="Çıkış yap">⏻</button>
      </header>

      <!-- İçerik alanı: sohbet ya da üyeler/arama -->
      <main class="content">

        <!-- SOHBET VIEW -->
        <section id="chatView" class="view active">
          <div id="messages" class="messages"></div>
          <form id="messageForm" class="message-bar">
            <input type="text" id="messageInput" placeholder="Bir mesaj yaz…" autocomplete="off" />
            <button type="submit" class="btn btn-send" aria-label="Gönder">➤</button>
          </form>
        </section>

        <!-- ÜYELER / ARAMA VIEW -->
        <section id="callView" class="view">
          <div class="family-room-card">
            <div class="family-room-info">
              <h2>Aile Odası</h2>
              <p id="roomStatus">Kimse odada değil</p>
            </div>
            <button id="joinRoomBtn" class="btn btn-primary">Odaya katıl</button>
          </div>

          <h3 class="section-label">Üyeler</h3>
          <ul id="memberList" class="member-list"></ul>
        </section>

      </main>

      <!-- Alt sekme çubuğu -->
      <nav class="tabbar">
        <button class="tab-btn active" data-view="chatView">
          <span class="tab-icon">💬</span><span>Sohbet</span>
        </button>
        <button class="tab-btn" data-view="callView">
          <span class="tab-icon">📞</span><span>Arama</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- ======= GELEN ARAMA BİLDİRİMİ ======= -->
  <div id="incomingCall" class="overlay hidden">
    <div class="incoming-card">
      <div class="pulse-avatar" id="callerAvatar">?</div>
      <p id="callerName">Biri arıyor…</p>
      <div class="incoming-actions">
        <button id="rejectCallBtn" class="btn btn-round btn-reject" aria-label="Reddet">✕</button>
        <button id="acceptCallBtn" class="btn btn-round btn-accept" aria-label="Kabul et">✓</button>
      </div>
    </div>
  </div>

  <!-- ======= AKTİF ARAMA EKRANI ======= -->
  <div id="activeCall" class="overlay hidden">
    <div class="active-call-card">
      <p class="active-call-label" id="activeCallLabel">Aile Odası</p>
      <div id="participantGrid" class="participant-grid"></div>
      <div class="call-controls">
        <button id="muteBtn" class="btn btn-round btn-muted" aria-label="Sessize al">🎤</button>
        <button id="hangupBtn" class="btn btn-round btn-hangup" aria-label="Kapat">📵</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Firebase SDK (compat, CDN üzerinden) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/viewport-fix.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/call.js"></script>
</body>
</html>
